# /etc/nginx/sites-available/api.spool.zasstech.com
# HTTPS is added by: certbot --nginx -d api.spool.zasstech.com
server {
    listen 80;
    listen [::]:80;
    server_name api.spool.zasstech.com;

    client_max_body_size 2m;   # session transcripts are text; 2 MB is plenty

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
