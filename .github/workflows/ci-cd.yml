name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jkhandeveloper/spool-api

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spool
          POSTGRES_PASSWORD: spool
          POSTGRES_DB: spool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spool" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://spool:spool@localhost:5432/spool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  image:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to api.spool.zasstech.com
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.spool.zasstech.com/api/v1/health
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets
        env:
          HAS_SECRETS: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::error::Add DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY repository secrets (see DEPLOY.md, step 3)."
            exit 1
          fi
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned host key of the server (ssh-keyscan -t ed25519 68.183.89.22).
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB4yoO2RSj2qVkEh62y47ZciABhB5iO/D4LU6Rq898+w" > ~/.ssh/known_hosts
      - name: Upload compose file and deploy script
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: scp -i ~/.ssh/deploy deploy/docker-compose.prod.yml deploy/deploy.sh "$TARGET:/opt/spool-api/"
      - name: Pull and restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
             && SPOOL_IMAGE='${{ env.IMAGE }}:${{ github.sha }}' /opt/spool-api/deploy.sh; \
             status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
      - name: Check public health endpoint
        run: |
          for i in $(seq 1 10); do
            curl -fsS https://api.spool.zasstech.com/api/v1/health && exit 0
            sleep 3
          done
          echo "Health check failed" >&2; exit 1
